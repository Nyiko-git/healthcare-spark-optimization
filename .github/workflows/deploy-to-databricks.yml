name: Deploy Notebooks to Databricks

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/script.sh | sh

      - name: Deploy all notebooks
        run: |
          for notebook in $(find . -name "*.py" -not -path "./.github/*"); do
            base=$(basename "$notebook" .py)
            dir=$(dirname "$notebook")

            # Clean up the directory string safely
            clean_dir=$(echo "$dir" | sed 's#^\./##' | sed 's#^\.$##')

            # Base target directory for your healthcare optimization project
            target_dir="/Users/${{ secrets.DATABRICKS_USER }}/healthcare-spark-optimization"

            # Append subdirectories if they exist
            if [ -n "$clean_dir" ]; then
              target_dir="$target_dir/$clean_dir"
            fi

            databricks workspace mkdirs "$target_dir"

            target_path="${target_dir}/${base}"
            echo "Deploying: $notebook -> $target_path"

            databricks workspace import \
              --language PYTHON \
              --format SOURCE \
              --overwrite \
              "$notebook" \
              "$target_path"
          done

      - name: Verify deployment
        run: |
          databricks workspace list "/Users/${{ secrets.DATABRICKS_USER }}/healthcare-spark-optimization/"